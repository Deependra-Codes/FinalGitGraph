[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "xtask",
]
default-members = [
  "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.94"

# `cargo xtask` runs from its own profile directory, so `cargo test` inside the gate can
# rebuild target/debug/xtask.exe while the gate is still running (Windows locks running exes).
[profile.xtask]
inherits = "dev"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
