[package]
name = "gitgraph-lab-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
perf-mimalloc = ["dep:mimalloc"]

[dependencies]
 bincode = "1.3.3"
gix = "0.80.0"
gix-pack = "0.67.0"
lmdb = "0.8.0"
lmdb-sys = "0.8.0"
memory-stats = "1.2.0"
mimalloc = { version = "0.1", optional = true }
rayon = "1.11.0"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
smallvec = "1.15.1"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.12.0"

[lints]
workspace = true
